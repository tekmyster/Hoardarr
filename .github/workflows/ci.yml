name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - run: uv run --project backend --locked ruff check backend/src backend/tests scripts/benchmark-telemetry.py scripts/soak-telemetry.py tests/integration/mergerfs_persistent_telemetry.py tests/integration/unraid_classification.py tests/integration/minio_control_plane_backup.py
      - run: uv run --project backend --locked pytest backend/tests -q
      - name: Run bounded-memory telemetry soak
        run: uv run --project backend --locked python scripts/soak-telemetry.py --drives 60 --cycles 100
      - name: Verify live read-only Linux telemetry sources
        run: uv run --project backend --locked python tests/integration/verify-linux-telemetry.py
      - run: uv build --project backend
      - run: python -m unittest discover -s tests/bootstrap -p 'test_*.py'
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
  minio-control-plane-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MINIO_ROOT_USER: hoardarr-integration
      MINIO_ROOT_PASSWORD: hoardarr-integration-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.8
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Build the final MinIO Community release from its official signed tag
        run: |
          for attempt in 1 2 3; do
            if GODEBUG=http2client=0 GOPROXY=https://proxy.golang.org,direct \
              go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z; then
              exit 0
            fi
            echo "MinIO dependency download failed on attempt ${attempt}; retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Start disposable MinIO and exercise backup, checksum, and restore validation
        run: |
          mkdir -p /tmp/hoardarr-minio-data dist/validation
          "$(go env GOPATH)/bin/minio" server /tmp/hoardarr-minio-data \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            >/tmp/hoardarr-minio.log 2>&1 &
          minio_pid=$!
          trap 'kill "$minio_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
          uv run --project backend --locked python tests/integration/minio_control_plane_backup.py
          cp /tmp/hoardarr-minio.log dist/validation/minio.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: minio-control-plane-backup-evidence
          path: |
            dist/validation/minio-backup.json
            dist/validation/minio.log
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run test:a11y
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload controller-redundancy browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: controller-redundancy-browser-evidence
          path: |
            frontend/test-results/**/controller-redundancy-*.png
            frontend/test-results/**/storage-lifecycle-*.png
            frontend/test-results/**/trace.zip
          if-no-files-found: warn
  ubuntu-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y php-cli python3.12 python3.12-venv systemd
      - run: python3.12 -m unittest discover -s tests/bootstrap -p 'test_*.py'
      - run: bash -n scripts/install-release-bundle.sh scripts/build-appliance.sh
      - run: python3 scripts/detect-hardware.py --help
      - name: Validate read-only Unraid assignment exporter
        run: |
          php -l scripts/export-unraid-assignments.php
          php scripts/export-unraid-assignments.php \
            --state tests/fixtures/unraid/disks.ini \
            --lsblk-json tests/fixtures/unraid/lsblk.json \
            --version-file tests/fixtures/unraid/unraid-version \
            > /tmp/hoardarr-unraid-assignments.json
          python3 tests/integration/verify-unraid-export.py \
            /tmp/hoardarr-unraid-assignments.json
  release-bundle-systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y systemd
      - run: uv sync --project backend --locked --all-groups
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: python3 scripts/build-release-bundle.py build --output-dir dist/releases
      - run: python3.12 -m unittest discover -s tests/release -p 'test_*.py'
      - name: Create checksummed release-candidate archive
        run: |
          release_dir="$(find dist/releases -mindepth 1 -maxdepth 1 -type d -name 'hoardarr-*' -print -quit)"
          test -n "$release_dir"
          archive="dist/$(basename "$release_dir").tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --use-compress-program='gzip -n' -cf "$archive" \
            -C "$(dirname "$release_dir")" "$(basename "$release_dir")"
          sha256sum "$archive" >"$archive.sha256"
      - name: Install the built wheel into an empty Python 3.12 environment
        run: |
          release_dir="$(find dist/releases -mindepth 1 -maxdepth 1 -type d -name 'hoardarr-*' -print -quit)"
          test -n "$release_dir"
          python3.12 -m venv /tmp/hoardarr-wheel-validation
          /tmp/hoardarr-wheel-validation/bin/pip install --no-index \
            --only-binary=:all: --require-hashes \
            --find-links "$release_dir/wheels" \
            -r "$release_dir/requirements/runtime.lock" \
            -r "$release_dir/requirements/hoardarr.lock"
          /tmp/hoardarr-wheel-validation/bin/hoardarr --help
          sudo install -d -m 0755 /usr/lib/hoardarr/scripts
          sudo ln -s /tmp/hoardarr-wheel-validation /usr/lib/hoardarr/venv
          sudo install -m 0555 scripts/detect-hardware.py /usr/lib/hoardarr/scripts/detect-hardware.py
      - name: Verify every Hoardarr systemd unit against installed entry points
        run: systemd-analyze verify packaging/systemd/hoardarr-*.service
      - uses: actions/upload-artifact@v4
        with:
          name: hoardarr-release-candidate
          path: |
            dist/hoardarr-*.tar.gz
            dist/hoardarr-*.tar.gz.sha256
  installed-appliance-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y python3.12 python3.12-venv
      - run: uv sync --project backend --locked --all-groups
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: python3 scripts/build-release-bundle.py build --output-dir dist/releases
      - name: Plan and apply the verified release on the disposable runner
        run: |
          release_dir="$(find dist/releases -mindepth 1 -maxdepth 1 -type d -name 'hoardarr-*' -print -quit)"
          test -n "$release_dir"
          sudo "$release_dir/scripts/install.sh" plan
          sudo "$release_dir/scripts/install.sh" apply --yes
      - name: Capture installer service diagnostics
        if: ${{ failure() }}
        run: |
          sudo systemctl status --no-pager --full hoardarr-migrate.service || true
          sudo journalctl --no-pager --unit hoardarr-migrate.service --lines 200 || true
          sudo systemctl status --no-pager --full \
            hoardarr-api.service \
            hoardarr-worker.service \
            hoardarr-account-executor.service \
            hoardarr-storage-executor.service \
            hoardarr-storage-status.service || true
      - name: Verify installed services, migration, permissions, and web health
        run: |
          systemctl is-active --quiet \
            hoardarr-api.service \
            hoardarr-worker.service \
            hoardarr-account-executor.service \
            hoardarr-storage-executor.service \
            hoardarr-storage-status.service
          systemctl is-enabled --quiet \
            hoardarr-api.service \
            hoardarr-worker.service \
            hoardarr-account-executor.service \
            hoardarr-storage-executor.service \
            hoardarr-storage-status.service
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:7877/health/live
          curl --fail --silent --show-error http://127.0.0.1:7877/health/ready
          state_permissions="$(stat -c '%U:%G:%a' /var/lib/hoardarr)"
          config_permissions="$(sudo stat -c '%U:%G:%a' /etc/hoardarr/hoardarr.env)"
          echo "state_permissions=${state_permissions}"
          echo "config_permissions=${config_permissions}"
          test "${state_permissions}" = "root:root:700"
          test "${config_permissions}" = "root:hoardarr:640"
          readlink /usr/lib/hoardarr/current
          sudo ls -ld /usr/lib/hoardarr/current /usr/lib/hoardarr/current/frontend
          sudo ls -l /usr/local/bin/hoardarr /usr/lib/hoardarr/current/frontend/index.html
          test -L /usr/lib/hoardarr/current || { echo "current release link is missing"; exit 1; }
          test -x /usr/local/bin/hoardarr || { echo "CLI wrapper is not executable"; exit 1; }
          sudo test -f /usr/lib/hoardarr/current/frontend/index.html || {
            echo "installed frontend entry point is missing"
            exit 1
          }
          sudo /usr/local/bin/hoardarr --help
      - name: Exercise installed encrypted export and fresh-appliance recovery
        run: |
          source_root=/tmp/hoardarr-recovery-source
          target_root=/tmp/hoardarr-recovery-target
          archive=/tmp/hoardarr-encrypted-control-plane.tar.gz
          passphrase='installed appliance recovery passphrase'
          sudo install -d -m 0700 "$source_root/config" "$target_root"
          sudo sh -c "printf '%s\n' 'HOARDARR_BIND_HOST=127.0.0.1' 'HOARDARR_SETUP_TOKEN=must-not-transfer' >'$source_root/config/hoardarr.env'"
          source_env=(
            HOARDARR_ENVIRONMENT=test
            "HOARDARR_DATABASE_URL=sqlite:///$source_root/hoardarr.db"
            "HOARDARR_SECRET_KEY_FILE=$source_root/secret.key"
            "HOARDARR_BACKUP_ARTIFACT_ROOT=$source_root/artifacts"
            "HOARDARR_CONFIGURATION_ROOT=$source_root/config"
            HOARDARR_SECURE_COOKIES=false
          )
          target_env=(
            HOARDARR_ENVIRONMENT=test
            "HOARDARR_DATABASE_URL=sqlite:///$target_root/hoardarr.db"
            "HOARDARR_SECRET_KEY_FILE=$target_root/secret.key"
            "HOARDARR_BACKUP_ARTIFACT_ROOT=$target_root/artifacts"
            "HOARDARR_CONFIGURATION_ROOT=$target_root/config"
            HOARDARR_SECURE_COOKIES=false
          )
          sudo env "${source_env[@]}" /usr/lib/hoardarr/venv/bin/python \
            -m hoardarr.runtime migrate
          printf '%s\n' 'source owner password' | sudo env "${source_env[@]}" \
            /usr/local/bin/hoardarr setup --console --username source-owner \
            --password-stdin --site-url http://127.0.0.1:7877
          printf '%s\n' "$passphrase" | sudo env "${source_env[@]}" \
            /usr/local/bin/hoardarr export-control-plane --output "$archive" \
            --encrypt-secrets > /tmp/hoardarr-export-report.json
          artifact_sha256="$(sudo sha256sum "$archive" | cut -d' ' -f1)"
          grep -F '"credential_mode": "encrypted_secret_key"' /tmp/hoardarr-export-report.json

          services=(
            hoardarr-api.service
            hoardarr-worker.service
            hoardarr-account-executor.service
            hoardarr-storage-executor.service
            hoardarr-storage-status.service
          )
          sudo systemctl stop "${services[@]}"
          trap 'sudo systemctl start hoardarr-account-executor.service hoardarr-storage-executor.service hoardarr-storage-status.service hoardarr-worker.service hoardarr-api.service' EXIT
          printf '%s\n' "$passphrase" | sudo env "${target_env[@]}" \
            /usr/local/bin/hoardarr restore-control-plane --archive "$archive" \
            --sha256 "$artifact_sha256" --passphrase-stdin --yes \
            > /tmp/hoardarr-restore-report.json
          grep -F '"credential_mode": "encrypted_secret_key"' /tmp/hoardarr-restore-report.json
          sudo env "${target_env[@]}" /usr/lib/hoardarr/venv/bin/python \
            -m hoardarr.runtime migrate
          printf '%s\n' 'fresh owner password' | sudo env "${target_env[@]}" \
            /usr/local/bin/hoardarr setup --console --username fresh-owner \
            --password-stdin --site-url http://127.0.0.1:7877
          sudo env "${target_env[@]}" /usr/lib/hoardarr/venv/bin/python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["HOARDARR_DATABASE_URL"].removeprefix("sqlite:///"))
          with sqlite3.connect(database) as connection:
              owners = connection.execute("SELECT username FROM users ORDER BY username").fetchall()
          assert owners == [("fresh-owner",)], owners
          environment = Path(os.environ["HOARDARR_CONFIGURATION_ROOT"]) / "hoardarr.env"
          payload = environment.read_text(encoding="utf-8")
          assert payload == "HOARDARR_BIND_HOST=127.0.0.1\n", payload
          print("installed encrypted fresh-appliance recovery verified")
          PY
          sudo systemctl start "${services[@]}"
          trap - EXIT
          systemctl is-active --quiet "${services[@]}"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:7877/health/ready
      - name: Verify idempotent reapply of the identical signed bundle
        run: |
          release_dir="$(find dist/releases -mindepth 1 -maxdepth 1 -type d -name 'hoardarr-*' -print -quit)"
          sudo "$release_dir/scripts/install.sh" apply --yes
          systemctl is-active --quiet hoardarr-api.service hoardarr-worker.service
          curl --fail --silent --show-error http://127.0.0.1:7877/health/ready
