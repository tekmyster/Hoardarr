name: Isolated storage integration
on:
  push:
    branches:
      - rc/0.3.11-validation
    paths:
      - .github/workflows/storage-integration.yml
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/src/hoardarr/operations/**
      - backend/src/hoardarr/connectivity/**
      - backend/src/hoardarr/storage/**
      - backend/src/hoardarr/api/routes/storage.py
      - backend/src/hoardarr/api/routes/storage_groups.py
      - backend/src/hoardarr/api/schemas.py
      - backend/src/hoardarr/db/**
      - backend/src/hoardarr/worker.py
      - backend/src/hoardarr/models.py
      - backend/alembic/**
      - tests/integration/**
  workflow_dispatch:
    inputs:
      run_extended_self_hosted:
        description: Run the privileged extended suite on a labeled disposable runner
        required: false
        default: false
        type: boolean
concurrency:
  group: storage-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  managed-zvol-lio-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Install disposable ZFS, LIO, and initiator tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs jq open-iscsi targetcli-fb zfsutils-linux
      - name: Exercise real managed-zvol LIO lifecycle
        run: |
          sudo touch /.hoardarr-disposable-runner
          lifecycle_status_file="$RUNNER_TEMP/managed-zvol-lio-lifecycle.status"
          umask 077
          set +e
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID \
            env HOARDARR_TEST_PYTHON="$PWD/backend/.venv/bin/python" \
            bash tests/integration/run-managed-zvol-lio-lifecycle.sh
          lifecycle_status=$?
          set -e
          printf '%s\n' "$lifecycle_status" > "$lifecycle_status_file"
          case "$lifecycle_status" in
            0|44) ;;
            *) exit "$lifecycle_status" ;;
          esac
      - name: Validate bounded managed-zvol lifecycle receipt
        id: managed_zvol_receipt
        if: always()
        env:
          HOARDARR_MANAGED_ZVOL_RECEIPT: dist/validation/managed-zvol-lio-lifecycle.json
        run: |
          PYTHONPATH="$PWD:$PWD/backend/src" "$PWD/backend/.venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          from tests.integration.managed_zvol_lio_lifecycle import validate_receipt

          try:
              status_path = Path(os.environ["RUNNER_TEMP"]) / "managed-zvol-lio-lifecycle.status"
              receipt_path = Path(os.environ["HOARDARR_MANAGED_ZVOL_RECEIPT"])
              status_bytes = status_path.read_bytes()
              if status_bytes not in {b"0\n", b"44\n"}:
                  raise ValueError
              lifecycle_status = int(status_bytes)
              receipt_bytes = receipt_path.read_bytes()
              if not receipt_bytes or len(receipt_bytes) > 65536:
                  raise ValueError
              receipt = validate_receipt(json.loads(receipt_bytes))
              failure = receipt["failure"]
              if lifecycle_status == 0:
                  valid = (
                      receipt["classification"] == "LOGIN_SUCCEEDED_LIFECYCLE_RESULT"
                      and failure["status"] == 0
                  )
              else:
                  downstream = receipt["downstream"]
                  payload = receipt["payload_verification"]
                  cleanup = receipt["cleanup"]
                  prohibited = receipt["prohibited_actions"]
                  valid = (
                      receipt["classification"]
                      == "LOGIN_SUCCEEDED_PAYLOAD_VERIFIED_RAW_TRANSITION"
                      and failure["code"] == "RAW_RESTART_TRANSITION_OBSERVED"
                      and failure["status"] == 44
                      and downstream["persistence_control_plane"] is True
                      and downstream["target_persistence_restart"] is False
                      and downstream["remove_absence"] is True
                      and downstream["backing_retained"] is True
                      and payload == {"attempted": True, "matched": True}
                      and cleanup["classification"] == "cleanup_complete"
                      and all(
                          phase["status"] in {"success", "skipped"}
                          and phase["postcondition"] is True
                          for phase in cleanup["phases"]
                      )
                      and all(
                          type(value) is int and value == 0
                          for value in prohibited.values()
                      )
                  )
              if not valid:
                  raise ValueError
          except Exception:
              raise SystemExit("managed-zvol evidence validation failed") from None
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.managed_zvol_receipt.outcome == 'success'
        with:
          name: managed-zvol-lio-lifecycle-evidence
          path: dist/validation/managed-zvol-lio-lifecycle.json
          if-no-files-found: error
  storage-group-drain-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Install disposable filesystem tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs jq
      - name: Exercise complete durable Storage Group drain lifecycle
        run: |
          sudo touch /.hoardarr-disposable-runner
          sudo --preserve-env=GITHUB_ACTIONS \
            env HOARDARR_TEST_PYTHON="$PWD/backend/.venv/bin/python" \
            bash tests/integration/run-storage-group-drain-lifecycle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: storage-group-drain-lifecycle-evidence
          path: dist/validation/storage-group-drain-lifecycle.json
  controller-redundancy-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Install disposable iSCSI and multipath tools
        run: sudo apt-get update && sudo apt-get install -y fio jq multipath-tools open-iscsi targetcli-fb
      - name: Verify single-path to redundant-controller lifecycle
        run: |
          sudo touch /.hoardarr-disposable-runner
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID \
            env HOARDARR_TEST_PYTHON="$PWD/backend/.venv/bin/python" \
            bash tests/integration/run-multipath-redundancy-lifecycle.sh
      - name: Verify durable failover telemetry evidence
        run: |
          jq -e '.failover_io_completed == true' dist/validation/multipath-redundancy-lifecycle.json
          jq -e '[.telemetry.path_a_failed.events[] | select(.event_type == "path_failed" or .event_type == "controller_failover" or .event_type == "redundancy_reduced")] | length > 0' dist/validation/multipath-redundancy-lifecycle.json
          jq -e '[.telemetry.path_a_failed.telemetry[] | select(.metric_id == "storage.path.state")] | length > 0' dist/validation/multipath-redundancy-lifecycle.json
      - uses: actions/upload-artifact@v4
        with:
          name: multipath-redundancy-lifecycle-evidence
          path: dist/validation/multipath-redundancy-lifecycle.json
  mergerfs-persistent-telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Install disposable mergerFS workload tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs fio mergerfs sysstat
      - name: Validate persistent telemetry on four loop-backed members
        run: |
          sudo touch /.hoardarr-disposable-runner
          sudo --preserve-env=GITHUB_ACTIONS \
            env HOARDARR_TEST_PYTHON="$PWD/backend/.venv/bin/python" \
            bash tests/integration/run-mergerfs-telemetry-workload.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mergerfs-persistent-telemetry-evidence
          path: dist/validation/mergerfs-persistent-telemetry.json
  extended-storage-stacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - run: uv sync --project backend --locked --all-groups
      - name: Install disposable filesystem and storage-stack tools
        run: sudo apt-get update && sudo apt-get install -y acl e2fsprogs jq lvm2 mdadm snapraid xfsprogs zfsutils-linux
      - name: Validate ACLs, array replacement, expansion, and SnapRAID on test-created loops
        run: |
          sudo touch /.hoardarr-disposable-runner
          sudo modprobe loop
          sudo modprobe zfs
          sudo --preserve-env=GITHUB_ACTIONS \
            env HOARDARR_TEST_PYTHON="$PWD/backend/.venv/bin/python" HOARDARR_EXTENDED_STORAGE_TESTS=1 \
            tests/integration/run-loop-device-tests.sh
          jq -e '.classification == "VERIFIED IN ISOLATION" and .data_member_added and .second_parity_added' \
            dist/validation/snapraid-expansion.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .vdev_count_before == 1 and .vdev_count_after == 2 and .pool_guid_before == .pool_guid_after and .dry_run_executed and (.force_override_used | not)' \
            dist/validation/zfs-expansion.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .production_executor_used and .create_verified and .restore_verified and .clone_verified and .delete_verified and .capacity_limits_verified and .capacity_limits_cleared and .provider_guid_before == .provider_guid_after and .journal_states == ["succeeded", "succeeded", "succeeded", "succeeded"] and .capacity_journal_states == ["succeeded", "succeeded"]' \
            dist/validation/zfs-snapshot-lifecycle.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .journal_state == "succeeded" and .parity_state == "current" and .recovered_sha256 == .expected_sha256 and .stable_alias_partition_used and .command_order == ["snapraid:status", "snapraid:fix", "snapraid:check", "snapraid:sync"]' \
            dist/validation/snapraid-replacement.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .provider == "linux_md" and .journal_state == "succeeded" and (.final_degraded | not) and .target_identity_before == .target_identity_after' \
            dist/validation/md-replacement.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .provider == "zfs" and .journal_state == "succeeded" and (.final_degraded | not) and .target_identity_before == .target_identity_after' \
            dist/validation/zfs-replacement.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and (.activation_performed | not) and (.mutation_performed_during_preview | not) and .profiles.linux_md.completeness.state == "complete" and .profiles.lvm.completeness.state == "complete" and .profiles.zfs.mountability.state == "not_reported"' \
            dist/validation/foreign-stack-preview.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .identified_roles.data == "identified" and .identified_roles.parity == "identified" and .matched_assignments == 2 and .without_assignment_role == "parity" and .without_assignment_classification == "suspected" and (.parity_reuse_supported | not) and (.mutation_performed_by_classification | not)' \
            dist/validation/unraid-classification.json
          jq -e '.classification == "VERIFIED IN ISOLATION" and .source_access == "read_only" and .source_retained and (.parity_reused | not) and .relative_paths_preserved and .pause_resume_executed and .restart_recovery_requeued and .stale_private_mount_recovered and .collision_failure_code == "destination_collision" and .source_sha256 == .destination_sha256 and .entry_states == ["verified"] and .source_unmounted_after' \
            dist/validation/foreign-migration.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-expansion-evidence
          path: |
            dist/validation/foreign-readonly-inspection.json
            dist/validation/foreign-stack-preview.json
            dist/validation/unraid-classification.json
            dist/validation/foreign-migration.json
            dist/validation/snapraid-expansion.json
            dist/validation/snapraid-replacement.json
            dist/validation/md-replacement.json
            dist/validation/zfs-expansion.json
            dist/validation/zfs-snapshot-lifecycle.json
            dist/validation/zfs-replacement.json
  disposable-block-devices:
    if: github.event_name == 'workflow_dispatch' && inputs.run_extended_self_hosted
    runs-on: [self-hosted, linux, hoardarr-storage-test]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - name: Install isolated storage tools
        run: sudo apt-get update && sudo apt-get install -y acl e2fsprogs mergerfs mdadm snapraid xfsprogs zfsutils-linux
      - run: uv sync --project backend --locked --all-groups
      - name: Verify isolated runner and execute loop-device suite
        run: sudo HOARDARR_EXTENDED_STORAGE_TESTS=1 tests/integration/run-loop-device-tests.sh
