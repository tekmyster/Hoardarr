name: Build appliance ISO
on:
  push:
    branches:
      - rc/0.3.11-validation
    paths:
      - .github/workflows/appliance.yml
      - frontend/package.json
      - frontend/package-lock.json
      - backend/pyproject.toml
      - backend/uv.lock
      - packaging/**
      - scripts/build-appliance.sh
      - scripts/build-offline-apt-repository.py
      - scripts/build-release-bundle.py
      - tests/appliance/**
      - tests/release/**
  workflow_dispatch:
    inputs:
      base_iso_url:
        description: Official Ubuntu 24.04 live-server ISO URL
        required: true
      base_iso_sha256:
        description: SHA-256 from Ubuntu SHA256SUMS
        required: true
concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BASE_ISO_URL: ${{ inputs.base_iso_url || 'https://releases.ubuntu.com/noble/ubuntu-24.04.4-live-server-amd64.iso' }}
      BASE_ISO_SHA256: ${{ inputs.base_iso_sha256 || 'e907d92eeec9df64163a7e454cbc8d7755e8ddc7ed42f99dbc80c40f1a138433' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg xorriso python3.12 python3.12-venv qemu-system-x86
      - name: Create isolated CI repository signing identity
        run: |
          cat >"$RUNNER_TEMP/ci-signing-key" <<'EOF'
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: Hoardarr offline repository CI validation
          Name-Email: ci-offline-repository@invalid.hoardarr.local
          Expire-Date: 1d
          %no-protection
          %commit
          EOF
          gpg --batch --generate-key "$RUNNER_TEMP/ci-signing-key"
          gpg --batch --with-colons --list-secret-keys ci-offline-repository@invalid.hoardarr.local |
            awk -F: '$1 == "fpr" { print $10; exit }' >"$RUNNER_TEMP/ci-signing-fingerprint"
          test "$(wc -l <"$RUNNER_TEMP/ci-signing-fingerprint")" -eq 1
      - name: Capture executed Ubuntu vulnerability status
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          command = ["pro", "security-status", "--format", "json"]
          result = subprocess.run(command, text=True, capture_output=True, check=False)
          try:
              payload = json.loads(result.stdout)
          except json.JSONDecodeError:
              payload = {"stdout": result.stdout}
          (Path(os.environ["RUNNER_TEMP"]) / "ubuntu-vulnerability-status.json").write_text(
              json.dumps(
                  {
                      "command": command,
                      "exit_code": result.returncode,
                      "result": payload,
                      "stderr": result.stderr,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          if result.returncode != 0:
              raise SystemExit("Ubuntu vulnerability-status command failed")
          PY
      - name: Build and verify complete signed offline APT repository
        run: |
          python3 scripts/build-offline-apt-repository.py build \
            --output dist/offline-repository \
            --signing-key "$(cat "$RUNNER_TEMP/ci-signing-fingerprint")" \
            --vulnerability-report "$RUNNER_TEMP/ubuntu-vulnerability-status.json"
          python3 scripts/build-offline-apt-repository.py verify dist/offline-repository
      - run: python3 scripts/build-release-bundle.py build --output-dir dist/releases
      - name: Create deterministic release archive
        run: |
          release_dir="$(find dist/releases -mindepth 1 -maxdepth 1 -type d -name 'hoardarr-*' -print -quit)"
          test -n "$release_dir"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            --use-compress-program='gzip -n' -cf dist/hoardarr-release.tar.gz \
            -C "$(dirname "$release_dir")" "$(basename "$release_dir")"
      - name: Restore the pinned Ubuntu base ISO cache
        uses: actions/cache@v4
        with:
          path: ubuntu.iso
          key: ubuntu-24.04-base-${{ env.BASE_ISO_SHA256 }}
      - name: Download the pinned Ubuntu base ISO when uncached
        run: |
          if [[ ! -f ubuntu.iso ]]; then
            curl --fail --location --proto '=https' --tlsv1.2 \
              --connect-timeout 30 --retry 5 --retry-delay 5 --retry-all-errors \
              --output ubuntu.iso "$BASE_ISO_URL"
          fi
      - run: scripts/build-appliance.sh ubuntu.iso "$BASE_ISO_SHA256" dist/hoardarr-release.tar.gz hoardarr.iso packaging/appliance/user-data dist/offline-repository
      - name: Boot the appliance to a visible interactive installer checkpoint
        run: |
          qemu-system-x86_64 -machine accel=tcg -m 2048 -smp 2 \
            -boot d -cdrom hoardarr.iso -no-reboot -display none \
            -serial file:qemu-serial.log \
            -monitor tcp:127.0.0.1:45454,server,nowait &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          sleep 60
          python3 - <<'PY'
          import re
          import socket
          import time
          from pathlib import Path

          def monitor_command(command: bytes) -> None:
              with socket.create_connection(("127.0.0.1", 45454), timeout=2) as monitor:
                  monitor.recv(4096)
                  monitor.sendall(command + b"\n")
                  time.sleep(1)

          for _ in range(30):
              try:
                  monitor_command(b"info status")
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("QEMU monitor did not become available")

          # Installer startup timing varies under TCG. Wake the framebuffer and
          # poll for a real visible console instead of trusting one instant.
          for attempt in range(40):
              monitor_command(b"sendkey ret")
              monitor_command(b"screendump qemu-installer.ppm")
              image = Path("qemu-installer.ppm").read_bytes()
              header = re.match(rb"P6\s+(?:#[^\n]*\n\s*)*(\d+)\s+(\d+)\s+(\d+)\s", image)
              if header is None:
                  raise SystemExit("QEMU installer screenshot is not a PPM image")
              pixels = image[header.end():]
              if len(set(pixels)) >= 8 and any(pixels):
                  break
              time.sleep(3)
          else:
              raise SystemExit("QEMU installer console stayed blank after bounded wake retries")
          PY
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoardarr-appliance
          path: |
            hoardarr.iso
            hoardarr.iso.sha256
            hoardarr.iso.tree-sha256
            dist/offline-repository/evidence/**
            dist/offline-repository/SHA256SUMS
            qemu-serial.log
            qemu-installer.ppm
      - name: Retain offline install inputs for no-network validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hoardarr-offline-install-inputs
          compression-level: 0
          retention-days: 3
          path: |
            dist/hoardarr-release.tar.gz
            dist/offline-repository

  offline-install:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pass: [pass-1, pass-2]
    runs-on: ubuntu-24.04
    env:
      BASE_ISO_URL: ${{ inputs.base_iso_url }}
      BASE_ISO_SHA256: ${{ inputs.base_iso_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xorriso qemu-system-x86 qemu-utils
      - uses: actions/download-artifact@v4
        with:
          name: hoardarr-offline-install-inputs
          path: dist
      - name: Download and verify the pinned Ubuntu base ISO
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 30 --retry 5 --retry-delay 5 --retry-all-errors \
            --output ubuntu.iso "$BASE_ISO_URL"
          echo "$BASE_ISO_SHA256  ubuntu.iso" | sha256sum --check --strict
      - name: Build the CI-only no-network validation ISO
        run: |
          scripts/build-appliance.sh \
            ubuntu.iso "$BASE_ISO_SHA256" \
            dist/hoardarr-release.tar.gz \
            hoardarr-offline-test.iso \
            tests/appliance/offline-user-data \
            dist/offline-repository
      - name: Execute clean install and first boot with no virtual NIC
        run: |
          tests/appliance/run-offline-iso-pass.sh \
            hoardarr-offline-test.iso \
            "offline-evidence/${{ matrix.pass }}" \
            "${{ matrix.pass }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoardarr-offline-${{ matrix.pass }}
          retention-days: 14
          path: |
            offline-evidence/${{ matrix.pass }}/**
            hoardarr-offline-test.iso.sha256
            hoardarr-offline-test.iso.tree-sha256
